id: vox-collage
version: 1
identity: {name: "Vox Collage", mood: documentary, pace: steady, motion_intensity: 6}
# vox-collage per user request (Oct 2026): ported from vox-director/vox-ai-motion-graphics
# (github.com/Alisa0808/vox-director, github.com/Anil-matcha/vox-ai-motion-graphics-generator)
# + explainroo's word-timed caption philosophy. Design language: mixed-media hand-cut paper
# collage — per-beat flat paper colors, halftone print dots, torn-paper headline banners,
# washi-tape corners, scattered paper cut-outs, red seal stamp. Camera moves follow the
# anti-monotony beat-layer rhythm (push_in/pan/static rotation); text stays fixed (vox law).
collage: true
flat_bg: true
persona_accents:
  - "203,60,44"
  - "36,80,60"
  - "176,110,40"
palette:
  bg0: "247,241,229"
  bg1: "231,215,190"
  accent: "203,60,44"
  white: "24,22,20"
  dim: "94,88,80"
  dim2: "130,122,112"
  card: "255,253,247"
  red: "203,60,44"
  grain: 0
  vignette: 0
fonts: {display: BebasNeue, heavy: ArchivoBlack, body: Poppins-SemiBold, med: Poppins-Medium, mono: DejaVuSansMono}
motion:
  springs: {soft: [9.0, 9.5], bouncy: [14, 22]}
  entrance: pop
  stagger_s: 0.07
  transition: {type: whip, frames: 8}
  shimmer: {target: logo, dur: 2.2}
  counter: spring_soft
cards: {style: brutal, shadow: 8, border: 4}
scenes:
  stat:
    headline: {y: 250, size: 80}
    number: {x: 84, y: 460, size: 310}
    label: {x: 92, y: 800, size: 44}
    bars: {x: 90, y: 940, w: 900}
    hint: {y: 1290}
    chips: {y: 1360}
    pip: {x: 640, y: 430, w: 360, h: 260}
  save:
    media: {y: 320, w: 860, h: 1000}
    headline: {y: 1340, size: 56}
    chips: {y: 1480}
  outro:
    headline: {y: 420, size: 80}
    body: {y: 700, size: 46}
    logo: {y: 1230, size: 220}
    chips: {y: 1480}
  defaults:
    headline: {y: 420, size: 80}
    body: {y: 700, size: 46}
audio:
  bed: {bpm: 84, gain: 0.2}
  loudness: {i: -14, tp: -1.5, lra: 11}
effects:
  grade: {contrast: 1.02, saturation: 1.06}
  flash_hook: "203,60,44"
pacing:
  hook_window_s: 1.2
  min_hold_s: 2.6
  captions: {max_words: 4, max_chars: 21, min_display_s: 0.5, tail_s: 0.2, y_off: 344}
  safe: {y_max: 0.81}
overrides: {max_deviation_ratio: 0.25, scene_overrides: []}
