name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Node syntax check
        run: |
          if [ -d node_modules ]; then
            find . -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -not -path './applied_companies_tracker_latest.json' -print0 | head -z -n 20 | xargs -0 -I {} node --check {} 2>&1 || true
          fi
        shell: bash

      - name: Run unit tests
        run: |
          if grep -q '"test"' package.json; then
            npm test --if-present
          else
            echo "No test script in package.json - skipping"
          fi
        shell: bash

  python-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          find services -name '*.py' -print0 | xargs -0 -I {} python3 -m py_compile {} 2>&1 || true
        shell: bash
